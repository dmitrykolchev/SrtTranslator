name: Создание релиза .NET

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - rid: win-x64
            archive_name: srt-translator-windows-x64.zip
            compress_type: zip
          - rid: linux-x64
            archive_name: srt-translator-linux-x64.tar.gz
            compress_type: tar

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' # Убедитесь, что версия доступна в репозиториях Actions

      # Явное указание .csproj исключает сайд-эффекты multi-project репозиториев
      - name: Publish Application
        run: |
          dotnet publish ./src/Xobex.SrtTrans/Xobex.SrtTrans.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:PublishTrimmed=false \
            /p:IncludeNativeLibrariesForSelfExtract=true \
            /p:EnableCompressionInSingleFile=true \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            -o ./out

      - name: Create Archive (Windows - Zip)
        if: matrix.compress_type == 'zip'
        run: |
          cd ./out
          zip -r ../${{ matrix.archive_name }} .

      - name: Create Archive (Linux - Tar.gz)
        if: matrix.compress_type == 'tar'
        run: |
          cd ./out
          tar -czf ../${{ matrix.archive_name }} .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: ${{ matrix.archive_name }}
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: ./dist

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
